</head>

<body>
    <div class="tm-page-container mx-auto">
        <header class="tm-header text-center">
            <h1 class="tm-title text-uppercase">Vladimir Zavodin</h1>
            <p class="tm-primary-color"><i>Personal web sites for your business</i></p>
        </header>

        <section class="tm-section">
            <nav class="tm-nav">
                <ul>
                    <li>
                        <a href="index.html"><span class="tm-nav-deco"></span>Intro</a>
                    </li>
                    <li>
                        <a href="gallery.html"><span class="tm-nav-deco"></span>Gallery</a>
                    </li>
                    <li class="active">
                        <a href="contact.html"><span class="tm-nav-deco"></span>Contact</a>
                    </li>
                </ul>
            </nav>
            <div class="tm-content-container">
                <div class="mb-0 tm-img-overlay-wrap">
                    <div class="tm-img-overlay"></div>
                    <div class="tm-img-overlay-text text-white p-5">
                        <h4 class="mb-4">Contact me</h4>
                        <p class="tm-small">
                            To get a free consultation and order a product that will elevate your business, reach out to me through the form below.
                        </p>
                    </div>
                </div>



                <div class="tm-content">
    <form action="https://api.web3forms.com/submit" method="POST" class="tm-contact-form">
        <div class="form-group">
            <input type="text" id="contact_name" name="contact_name"
                class="form-control rounded-0 border-top-0 border-right-0 border-left-0"
                placeholder="Name" required="" />
        </div>
        <div class="form-group">
            <input type="email" id="contact_email" name="contact_email"
                class="form-control rounded-0 border-top-0 border-right-0 border-left-0"
                placeholder="Email" required="" />
        </div>
        <div class="form-group">
            <textarea rows="6" id="contact_message" name="contact_message"
                class="form-control rounded-0 border-top-0 border-right-0 border-left-0"
                placeholder="Message..." required=""></textarea>
        </div>
        
        <!-- Hidden Input for Web3Forms API Key -->
        <input type="hidden" name="access_key" value="2dc9b407-b427-46bc-88eb-70f7e5c5b931">

        <div class="form-group text-right">
            <button type="submit" class="btn btn-primary rounded-0">
                Submit
            </button>
        </div>
    </form>
</div>

            </div>
        </section>

        <footer>
